name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history so gitleaks can scan every commit.
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        # Picks up .gitleaks.toml from the repo root automatically.
        # GITLEAKS_LICENSE is only required for organization/private-repo
        # plans — public repos run without it per the action README.

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pin to the 1.3 minor line instead of `latest` so tool/lockfile
          # upgrades are deliberate. Matches "engines.bun" in package.json.
          bun-version: 1.3.x

      - name: Setup Node (for Vercel build tooling)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Keep in sync with .nvmrc and Vercel's default Node runtime.
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck (frontend)
        run: bun run typecheck

      - name: Typecheck (API)
        run: bun run typecheck:api

      - name: Test (with coverage)
        run: bun test --coverage
        # No coverage thresholds enforced yet — ratchet them in once a
        # baseline exists so coverage can only go up.

      - name: Build
        run: bun run build
        env:
          # Frontend build does not require secrets; Vite env defaults are fine.
          NODE_ENV: production
